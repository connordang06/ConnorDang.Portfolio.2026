<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Manager — Connor Dang</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<!-- Decap CMS (formerly Netlify CMS). This page is the editor at /admin —
     log in with the Netlify Identity account set up for this site, and the
     form here edits ../data/work.json and uploads images into
     ../work-images/, committing straight to the GitHub repo. -->
<script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

<script>
  // Sends people straight into login if they land on /admin without a
  // session, and reloads after they confirm an invite/reset email so the
  // CMS picks up the fresh session immediately.
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", (user) => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>

</body>
</html>
